<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Motor visual de @aprendesencillo. Todo se pinta desde pintar(t): nada de animaciones CSS,
     así cada fotograma es determinista y el render no depende del reloj real. -->
<style>
  :root {
    --fondo-1: #050b1f; --fondo-2: #0c1f4a;
    --cian: #22e3f5; --azul: #2f6bff; --morado: #9b5cff;
    --amarillo: #ffd23f; --naranja: #ffb000; --crema: #f6e7c8;
    --texto: #ffffff; --texto-suave: rgba(255,255,255,.72);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo-1); }
  body { font-family: 'Inter', 'Noto Color Emoji', sans-serif; color: var(--texto); position: relative; }
  .emoji { font-family: 'Noto Color Emoji', sans-serif; line-height: 1; display: inline-block; }

  #fondo { position: absolute; inset: 0; background: radial-gradient(circle at 50% 46%, #12306e 0%, var(--fondo-2) 32%, var(--fondo-1) 78%); }
  #estrellas { position: absolute; inset: 0; }
  #halo { position: absolute; left: 540px; top: 880px; width: 980px; height: 980px; margin: -490px 0 0 -490px; border-radius: 50%;
          background: radial-gradient(circle, rgba(47,107,255,.28), rgba(155,92,255,.10) 45%, transparent 68%); }
  #barra { position: absolute; top: 0; left: 0; height: 10px; background: linear-gradient(90deg, var(--cian), var(--azul), var(--morado)); }

  #cabecera { position: absolute; top: 225px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 18px; }
  #cabecera img { width: 78px; height: 78px; border-radius: 50%; box-shadow: 0 0 34px rgba(34,227,245,.5); }
  #cabecera span { font-size: 40px; font-weight: 700; letter-spacing: .5px; color: var(--texto-suave); }

  #titulo { position: absolute; top: 335px; left: 70px; right: 70px; text-align: center; font-size: 58px; font-weight: 800; line-height: 1.12;
            padding: 24px 34px; border-radius: 36px; background: rgba(255,255,255,.06); border: 3px solid rgba(34,227,245,.38);
            box-shadow: inset 0 0 40px rgba(47,107,255,.25), 0 0 40px rgba(34,227,245,.12); }

  #escena { position: absolute; top: 600px; left: 60px; right: 60px; height: 640px; display: flex; align-items: center; justify-content: center; }
  .v { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; width: 100%; will-change: transform, opacity; }

  #subs { position: absolute; top: 1310px; left: 50px; right: 50px; text-align: center; font-size: 86px; font-weight: 900; line-height: 1.12; }
  #subs .p { display: inline-block; margin: 0 9px; -webkit-text-stroke: 12px #050b1f; paint-order: stroke fill; text-shadow: 0 8px 26px rgba(0,0,0,.65); }
  #subs .activa { color: var(--amarillo); }

  /* contador */
  .v-contador { gap: 10px; }
  .v-contador .etiqueta { font-size: 46px; font-weight: 800; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 3px; text-align: center; }
  .v-contador .numero { font-size: 250px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -6px;
                        background: linear-gradient(180deg, #fff 25%, var(--amarillo)); -webkit-background-clip: text; background-clip: text; color: transparent;
                        filter: drop-shadow(0 0 34px rgba(255,210,63,.45)); }
  .v-contador .unidad { font-size: 96px; font-weight: 900; color: var(--cian); filter: drop-shadow(0 0 24px rgba(34,227,245,.5)); }
  .v-contador .emoji { font-size: 120px; margin-bottom: 10px; }

  /* tierra */
  .v-tierra { gap: 26px; }
  .globo { position: relative; width: 540px; height: 540px; }
  .globo svg { position: absolute; inset: 0; filter: drop-shadow(0 0 40px rgba(34,227,245,.35)); }
  .volador { position: absolute; font-size: 120px; opacity: 0; }
  .v-tierra .txt { font-size: 60px; font-weight: 900; text-align: center; }

  /* comparar */
  .v-comparar { gap: 46px; }
  .fila { width: 100%; display: grid; grid-template-columns: 120px 1fr; align-items: center; column-gap: 26px; }
  .fila .emoji { font-size: 100px; text-align: center; }
  .fila .info { display: flex; flex-direction: column; gap: 14px; }
  .fila .cab { font-size: 48px; font-weight: 800; display: flex; justify-content: space-between; }
  .fila .valor { color: var(--texto-suave); font-variant-numeric: tabular-nums; }
  .fila .pista { height: 36px; border-radius: 18px; background: rgba(255,255,255,.09); overflow: hidden; }
  .fila .relleno { height: 100%; width: 0; border-radius: 18px; background: linear-gradient(90deg, var(--cian), var(--azul)); }
  .fila.max .relleno { background: linear-gradient(90deg, var(--naranja), var(--amarillo)); box-shadow: 0 0 26px rgba(255,210,63,.65); }
  .fila.max .valor { color: var(--amarillo); }
  .v-comparar .unidad { font-size: 40px; font-weight: 700; color: var(--texto-suave); letter-spacing: 2px; text-transform: uppercase; }

  /* icono */
  .v-icono { gap: 34px; }
  .v-icono .emoji { font-size: 290px; filter: drop-shadow(0 0 44px rgba(255,210,63,.35)); }
  .v-icono .texto { font-size: 104px; font-weight: 900; text-align: center; line-height: 1.04;
                    background: linear-gradient(180deg, #fff 30%, var(--crema)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .v-icono .texto.largo { font-size: 78px; }
  .v-icono .subtexto { font-size: 46px; font-weight: 600; color: var(--texto-suave); text-align: center; margin-top: -14px; }

  /* flecha */
  .v-flecha { flex-direction: row; gap: 10px; }
  .lado { display: flex; flex-direction: column; align-items: center; gap: 22px; width: 340px; }
  .lado .emoji { font-size: 210px; }
  .lado .txt { font-size: 54px; font-weight: 900; text-align: center; line-height: 1.08; }
  .v-flecha svg { width: 200px; flex: none; margin-bottom: 90px; }

  /* lista */
  .v-lista { gap: 30px; align-items: stretch; }
  .item { display: flex; align-items: center; gap: 30px; padding: 24px 34px; border-radius: 32px; background: rgba(255,255,255,.07); border: 2px solid rgba(34,227,245,.22); }
  .item .emoji { font-size: 86px; flex: none; }
  .item .txt { font-size: 52px; font-weight: 800; line-height: 1.1; }

  /* dianoche */
  .v-dianoche { gap: 44px; }
  .disco { width: 440px; height: 440px; border-radius: 50%; position: relative; overflow: hidden; box-shadow: 0 0 70px rgba(255,210,63,.32); }
  .mitad { position: absolute; top: 0; bottom: 0; width: 50%; display: flex; align-items: center; justify-content: center; }
  .mitad.dia { left: 0; background: linear-gradient(135deg, #ffe58a, #ffb000); }
  .mitad.noche { right: 0; background: linear-gradient(135deg, #1d2f78, #050b1f); }
  .mitad .emoji { font-size: 130px; }
  .etiquetas { display: flex; gap: 70px; }
  .etq { font-size: 56px; font-weight: 900; text-align: center; line-height: 1.1; }
  .etq small { display: block; font-size: 40px; font-weight: 700; color: var(--texto-suave); }
</style>
</head>
<body>
  <div id="fondo"></div>
  <div id="halo"></div>
  <canvas id="estrellas" width="1080" height="1920"></canvas>
  <div id="barra"></div>
  <div id="cabecera"><img id="logo" src="../assets/logo.png" alt=""><span>@aprendesencillo</span></div>
  <div id="titulo"></div>
  <div id="escena"></div>
  <div id="subs"></div>

<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeBack = x => { x = clamp(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// es-ES no agrupa números de 4 cifras con Intl; aquí siempre ponemos el punto de miles.
const miles = (n, dec = 0) => { const [e, d] = Math.abs(n).toFixed(dec).split('.'); return (n < 0 ? '−' : '') + e.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (d ? ',' + d : ''); };
const emoji = (e, cls = '') => `<span class="emoji ${cls}">${esc(e)}</span>`;

function azar(semilla) { return () => { semilla |= 0; semilla = semilla + 0x6D2B79F5 | 0; let t = Math.imul(semilla ^ semilla >>> 15, 1 | semilla); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

let D, actual = -1, vis = null, trozos = [];
const $ = id => document.getElementById(id);
const rnd = azar(7);
const estrellas = Array.from({ length: 110 }, () => ({ x: rnd() * 1080, y: rnd() * 1920, r: 0.8 + rnd() * 2.4, v: 4 + rnd() * 14, f: rnd() * 6.28 }));

// ---------- visuales ----------
const VISUALES = {
  contador(v) {
    const el = div('v v-contador', `${v.icono ? emoji(v.icono) : ''}<div class="etiqueta">${esc(v.etiqueta)}</div><div class="numero">0</div><div class="unidad">${esc(v.unidad)}</div>`);
    const num = el.querySelector('.numero');
    return { el, update(lt) {
      const p = 0.6 + 0.4 * easeOut(lt / 0.9);
      num.textContent = miles(v.valor * p, v.decimales || 0);
      num.style.transform = `scale(${1 + 0.04 * Math.sin(Math.max(0, lt - 1.55) * 5) * (lt > 1.55 ? 1 : 0)})`;
    } };
  },

  tierra(v) {
    const P = 640;
    const continentes = `
      <path d="M70 150 C110 80 210 90 240 150 C270 210 210 250 180 320 C160 370 120 365 108 300 C96 240 40 205 70 150Z"/>
      <path d="M150 360 C190 350 230 380 215 430 C200 480 170 500 150 470 C135 440 120 375 150 360Z"/>
      <path d="M340 110 C400 75 480 95 530 135 C570 165 552 215 500 225 C460 235 440 275 460 335 C480 395 430 440 398 395 C368 345 338 295 350 245 C360 195 310 150 340 110Z"/>
      <path d="M560 330 C600 310 640 330 640 365 C640 400 600 412 575 402 C550 392 535 350 560 330Z"/>
      <circle cx="300" cy="200" r="16"/><circle cx="610" cy="240" r="12"/><circle cx="40" cy="420" r="14"/>`;
    const capa = x => `<g transform="translate(${x} 20)">${continentes}</g>`;
    const voladores = (v.voladores || ['🚗', '🏠', '🐄', '🌳', '🧍']).slice(0, 6);
    const el = div('v v-tierra', `
      <div class="globo">
        <svg viewBox="0 0 560 560">
          <defs>
            <radialGradient id="oc" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#55b8ff"/><stop offset=".6" stop-color="#1b5fd1"/><stop offset="1" stop-color="#0a2c7a"/></radialGradient>
            <radialGradient id="som" cx="36%" cy="30%" r="72%"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".33" stop-color="#fff" stop-opacity="0"/><stop offset=".78" stop-color="#000a2a" stop-opacity=".25"/><stop offset="1" stop-color="#000a2a" stop-opacity=".75"/></radialGradient>
            <clipPath id="clip"><circle cx="280" cy="280" r="250"/></clipPath>
          </defs>
          <circle cx="280" cy="280" r="264" fill="none" stroke="#22e3f5" stroke-opacity=".4" stroke-width="10"/>
          <circle cx="280" cy="280" r="250" fill="url(#oc)"/>
          <g clip-path="url(#clip)"><g class="cont" fill="#3ccf72">${capa(0)}${capa(P)}</g></g>
          <circle cx="280" cy="280" r="250" fill="url(#som)"/>
        </svg>
        ${voladores.map(e => `<span class="emoji volador">${esc(e)}</span>`).join('')}
      </div>
      ${v.texto ? `<div class="txt">${esc(v.texto)}</div>` : ''}`);
    const cont = el.querySelector('.cont');
    const vol = [...el.querySelectorAll('.volador')];
    const r = azar(3);
    const datos = vol.map((_, i) => ({ y: 120 + i * (300 / Math.max(1, vol.length - 1)), d: i * 0.12 + r() * 0.08, giro: 300 + r() * 500, sube: -60 - r() * 140 }));
    const VEL = 150; // px/s de giro aparente
    return { el, update(lt, dur) {
      const modo = v.modo || 'gira';
      const tf = dur * 0.55; // instante en que se para cuando frena
      let rot;
      if (modo === 'parada') rot = 0;
      else if (modo === 'frena') rot = lt < tf ? VEL * (lt - lt * lt / (2 * tf)) : VEL * tf / 2;
      else rot = VEL * lt;
      cont.setAttribute('transform', `translate(${-(rot % P)} 0)`);
      vol.forEach((e, i) => {
        const k = modo === 'frena' ? lt - tf - datos[i].d : -1;
        if (k <= 0) { e.style.opacity = 0; return; }
        const x = 330 + 650 * Math.pow(k, 1.4), y = datos[i].y + datos[i].sube * k;
        e.style.opacity = clamp(3 - k);
        e.style.transform = `translate(${x}px, ${y}px) rotate(${datos[i].giro * k}deg)`;
      });
    } };
  },

  comparar(v) {
    const items = v.items.slice(0, 4);
    const max = Math.max(...items.map(i => i.valor));
    const el = div('v v-comparar', items.map(i => `
      <div class="fila${i.valor === max ? ' max' : ''}">
        ${emoji(i.icono || '•')}
        <div class="info"><div class="cab"><span>${esc(i.nombre)}</span><span class="valor">0</span></div><div class="pista"><div class="relleno"></div></div></div>
      </div>`).join('') + (v.unidad ? `<div class="unidad">${esc(v.unidad)}</div>` : ''));
    const filas = [...el.querySelectorAll('.fila')];
    return { el, update(lt) {
      filas.forEach((f, k) => {
        const p = easeOut((lt - 0.2 - 0.35 * k) / 0.7);
        f.querySelector('.relleno').style.width = `${100 * p * items[k].valor / max}%`;
        f.querySelector('.valor').textContent = miles(items[k].valor * p);
        f.style.opacity = clamp((lt - 0.1 - 0.35 * k) / 0.25);
      });
    } };
  },

  icono(v) {
    const largo = (v.texto || '').length > 14;
    const el = div('v v-icono', `${emoji(v.icono || '💡')}${v.texto ? `<div class="texto${largo ? ' largo' : ''}">${esc(v.texto)}</div>` : ''}${v.subtexto ? `<div class="subtexto">${esc(v.subtexto)}</div>` : ''}`);
    const ico = el.querySelector('.emoji');
    return { el, update(lt) {
      ico.style.transform = `translateY(${Math.sin(lt * 2.2) * 14}px) rotate(${Math.sin(lt * 1.6) * 4}deg) scale(${0.6 + 0.4 * easeBack(lt / 0.5)})`;
    } };
  },

  flecha(v) {
    const el = div('v v-flecha', `
      <div class="lado de">${emoji(v.de.icono)}<div class="txt">${esc(v.de.texto)}</div></div>
      <svg viewBox="0 0 200 90"><defs><linearGradient id="gf"><stop offset="0" stop-color="#22e3f5"/><stop offset="1" stop-color="#9b5cff"/></linearGradient></defs>
        <path pathLength="1" d="M12 45 H176 M140 12 L184 45 L140 78" stroke="url(#gf)" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1"/></svg>
      <div class="lado a">${emoji(v.a.icono)}<div class="txt">${esc(v.a.texto)}</div></div>`);
    const [de, a] = el.querySelectorAll('.lado');
    const trazo = el.querySelector('path');
    return { el, update(lt) {
      de.style.opacity = clamp(lt / 0.3); de.style.transform = `scale(${0.6 + 0.4 * easeBack(lt / 0.5)})`;
      trazo.setAttribute('stroke-dashoffset', 1 - easeOut((lt - 0.45) / 0.5));
      const ka = lt - 0.85;
      a.style.opacity = clamp(ka / 0.3); a.style.transform = `scale(${0.6 + 0.4 * easeBack(ka / 0.5)})`;
    } };
  },

  lista(v) {
    const items = v.items.slice(0, 4);
    const el = div('v v-lista', items.map(i => `<div class="item">${emoji(i.icono || '✅')}<div class="txt">${esc(i.texto)}</div></div>`).join(''));
    const filas = [...el.querySelectorAll('.item')];
    return { el, update(lt, dur) {
      filas.forEach((f, k) => {
        const kt = lt - 0.1 - (dur * 0.65) * k / items.length;
        f.style.opacity = clamp(kt / 0.25);
        f.style.transform = `translateX(${(1 - easeOut(kt / 0.45)) * -120}px)`;
      });
    } };
  },

  dianoche(v) {
    const el = div('v v-dianoche', `
      <div class="disco"><div class="mitad dia">${emoji('☀️')}</div><div class="mitad noche">${emoji('🌙')}</div></div>
      <div class="etiquetas"><div class="etq">${esc(v.dia || '6 meses')}<small>de día</small></div><div class="etq">${esc(v.noche || '6 meses')}<small>de noche</small></div></div>`);
    const disco = el.querySelector('.disco');
    const icos = [...el.querySelectorAll('.mitad .emoji')];
    return { el, update(lt, dur) {
      const g = 180 * easeOut(lt / dur);
      disco.style.transform = `rotate(${g}deg)`;
      icos.forEach(i => i.style.transform = `rotate(${-g}deg)`);
    } };
  },
};

function div(cls, html) { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; return d; }

// ---------- subtítulos ----------
function prepararSubs() {
  const escenaDe = t => D.escenas.findIndex(e => t >= e.inicio && t < e.fin);
  let cur = null;
  D.palabras.forEach((p, i) => {
    const prev = D.palabras[i - 1];
    const corta = !cur || cur.p.length >= 3 || cur.p.map(x => x.w).join(' ').length + p.w.length > 17 ||
                  (prev && p.t - (prev.t + prev.d) > 0.28) || escenaDe(p.t) !== cur.e;
    if (corta) { cur = { p: [], e: escenaDe(p.t) }; trozos.push(cur); }
    cur.p.push(p);
  });
  trozos.forEach((c, i) => {
    c.ini = c.p[0].t;
    const ult = c.p[c.p.length - 1];
    c.fin = Math.min(ult.t + ult.d + 0.35, trozos[i + 1] ? trozos[i + 1].p[0].t : Infinity);
  });
}

let trozoActual = null;
function pintarSubs(t) {
  const c = trozos.find(c => t >= c.ini && t < c.fin) || null;
  const caja = $('subs');
  if (c !== trozoActual) {
    trozoActual = c;
    caja.innerHTML = c ? c.p.map(p => `<span class="p">${esc(p.w)}</span>`).join(' ') : '';
  }
  if (!c) return;
  const spans = caja.querySelectorAll('.p');
  let activa = 0;
  c.p.forEach((p, i) => { if (t >= p.t) activa = i; });
  spans.forEach((s, i) => {
    s.classList.toggle('activa', i === activa);
    s.style.transform = i === activa ? 'scale(1.08)' : 'scale(1)';
  });
  caja.style.transform = `scale(${1 + 0.12 * (1 - easeOut((t - c.ini) / 0.12))})`;
}

// ---------- fondo ----------
function pintarFondo(t) {
  const cv = $('estrellas'), ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 1080, 1920);
  for (const s of estrellas) {
    const y = ((s.y - s.v * t) % 1920 + 1920) % 1920;
    ctx.globalAlpha = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 1.7 + s.f));
    ctx.fillStyle = s.r > 2.4 ? '#ffd23f' : '#cfe8ff';
    ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, 6.283); ctx.fill();
  }
  $('halo').style.transform = `scale(${1 + 0.05 * Math.sin(t * 1.3)})`;
  $('barra').style.width = `${100 * t / D.duracion}%`;
}

// ---------- API para render.cjs ----------
window.iniciar = datos => {
  D = datos;
  $('titulo').textContent = D.titulo;
  prepararSubs();
  return new Promise(r => { const l = $('logo'); l.complete ? r() : (l.onload = l.onerror = r); });
};

window.pintar = t => {
  let i = D.escenas.findIndex(e => t >= e.inicio && t < e.fin);
  if (i < 0) i = D.escenas.length - 1;
  if (i !== actual) {
    actual = i;
    const v = D.escenas[i].visual || {};
    vis = (VISUALES[v.tipo] || VISUALES.icono)(v);
    $('escena').replaceChildren(vis.el);
  }
  const e = D.escenas[i], lt = t - e.inicio, dur = e.fin - e.inicio;
  const entra = i === 0 ? 1 : easeBack(lt / 0.45);
  const op = Math.min(i === 0 ? 1 : clamp(lt / 0.25), clamp((e.fin - t) / 0.2));
  vis.el.style.opacity = op;
  vis.el.style.transform = `scale(${(0.82 + 0.18 * entra) * (1 + 0.035 * lt / dur)})`;
  vis.update(lt, dur);
  pintarSubs(t);
  pintarFondo(t);
};
</script>
</body>
</html>
