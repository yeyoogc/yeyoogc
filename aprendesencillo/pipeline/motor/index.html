<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Lienzo de @aprendesencillo: fondo + 3D (Three.js) + capa de anotaciones + subtítulos.
     Todo se pinta desde pintar(t) en motor.js, así cada fotograma es determinista. -->
<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<style>
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(fuentes/jetbrains-mono-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url(fuentes/jetbrains-mono-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 800; src: url(fuentes/jetbrains-mono-latin-800-normal.woff2) format('woff2'); }
  :root {
    --negro: #07080c; --texto: #fff; --gris: rgba(255,255,255,.5); --azul-sel: #4d8dff;
    --cian: #2ee6f0; --azul: #4f7dff; --morado: #a46bff; --rosa: #ff5fa2; --naranja: #ff9b3d; --amarillo: #ffd23f; --rojo: #ff4d5e; --verde: #3ddc84;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--negro); }
  body { font-family: 'Inter', sans-serif; color: var(--texto); position: relative; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .emoji { font-family: 'Noto Color Emoji', sans-serif; font-weight: 400; }
  #webgl, #fx, #capa, #subs { position: absolute; inset: 0; }
  #webgl { width: 1080px; height: 1920px; }
  #capa { pointer-events: none; }

  /* subtítulos: frase corta arriba, palabras clave en blanco y la palabra activa con caja de selección */
  #subs { top: 250px; bottom: auto; left: 50px; right: 50px; text-align: center; font-size: 82px; line-height: 1.22; letter-spacing: -1.5px; text-shadow: 0 3px 22px rgba(0,0,0,.6); }
  #subs .p { position: relative; display: inline-block; margin: 0 9px; color: rgba(255,255,255,.52); font-weight: 500; }
  #subs .p.clave { color: var(--texto); font-weight: 800; }
  #subs .p.activa { color: var(--texto); }
  #subs .sel { display: none; position: absolute; inset: 4px -10px 0 -10px; border: 3px solid var(--azul-sel); background: rgba(77,141,255,.14); }
  #subs .activa .sel { display: block; }
  #subs .sel b { position: absolute; width: 14px; height: 14px; background: #fff; border: 3px solid var(--azul-sel); }
  #subs .sel b:nth-child(1) { left: -9px; top: -9px; } #subs .sel b:nth-child(2) { right: -9px; top: -9px; }
  #subs .sel b:nth-child(3) { left: -9px; bottom: -9px; } #subs .sel b:nth-child(4) { right: -9px; bottom: -9px; }

  /* anotaciones */
  .ov { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .numero { font-family: 'JetBrains Mono', monospace; font-weight: 800; letter-spacing: -4px; white-space: nowrap; line-height: 1; text-shadow: 0 0 40px rgba(255,255,255,.12); }
  .numero .uni { font-size: .38em; letter-spacing: 0; margin-left: .25em; color: var(--gris); font-weight: 700; }
  .tarjeta { min-width: 520px; padding: 22px 30px 24px 34px; border-radius: 22px; background: rgba(16,18,25,.88); border: 2px solid rgba(255,255,255,.12);
             box-shadow: 0 20px 60px rgba(0,0,0,.55); }
  .tarjeta::before { content: ''; position: absolute; left: 14px; top: 20px; bottom: 20px; width: 6px; border-radius: 3px; background: var(--acento, var(--naranja)); }
  .tarjeta .tit { font-size: 30px; font-weight: 700; letter-spacing: 5px; color: var(--gris); text-transform: uppercase; }
  .tarjeta .val { font-family: 'JetBrains Mono', monospace; font-size: 58px; font-weight: 700; margin-top: 8px; white-space: nowrap; }
  .etiqueta { font-family: 'JetBrains Mono', monospace; font-size: 42px; font-weight: 700; white-space: nowrap; color: var(--c, var(--amarillo));
              padding: 8px 16px; border-radius: 10px; background: rgba(7,8,12,.72); border: 2px solid currentColor; }
  .caja { border: 3px solid var(--c, var(--amarillo)); border-radius: 12px; box-shadow: 0 0 24px color-mix(in srgb, var(--c, var(--amarillo)) 40%, transparent); }
  .caja .rot { position: absolute; left: -3px; bottom: calc(100% + 10px); font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 700; color: var(--c, var(--amarillo)); white-space: nowrap; }
  .circulo { border: 3px solid var(--c, var(--cian)); border-radius: 50%; box-shadow: 0 0 30px color-mix(in srgb, var(--c, var(--cian)) 45%, transparent), inset 0 0 30px color-mix(in srgb, var(--c, var(--cian)) 25%, transparent); }
  .sello { font-family: 'JetBrains Mono', monospace; font-size: 84px; font-weight: 800; color: var(--c, var(--rojo)); padding: 10px 34px; border: 6px solid currentColor; border-radius: 18px;
           background: rgba(7,8,12,.6); transform-origin: center; white-space: nowrap; }
  .nota { font-size: 30px; font-weight: 500; color: rgba(255,255,255,.42); white-space: nowrap; }
  .nota::before { content: '◆ '; font-size: 18px; vertical-align: 3px; }
  .texto { font-size: 56px; font-weight: 800; text-align: center; }

  /* móvil para la llamada a compartir */
  .movil { width: 640px; height: 800px; border-radius: 60px; background: #0d0f15; border: 6px solid #2a2e38; box-shadow: 0 40px 120px rgba(0,0,0,.7), 0 0 0 2px #000; overflow: hidden; }
  .movil .hoja { position: absolute; left: 0; right: 0; bottom: 0; height: 430px; background: #181b23; border-radius: 40px 40px 0 0; padding: 26px 34px; }
  .movil .asa { width: 90px; height: 8px; border-radius: 4px; background: #3a3f4b; margin: 0 auto 24px; }
  .movil .buscar { height: 66px; border-radius: 18px; background: #232733; color: #8a90a0; font-size: 28px; display: flex; align-items: center; padding: 0 22px; gap: 14px; }
  .movil .gente { display: flex; justify-content: space-around; margin: 30px 0 26px; }
  .movil .persona { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 24px; color: #c9cdd6; }
  .movil .cara { width: 104px; height: 104px; border-radius: 50%; background: #2a2f3b; display: flex; align-items: center; justify-content: center; font-size: 62px; position: relative; }
  .movil .persona.elegida .cara { box-shadow: 0 0 0 5px var(--azul-sel); }
  .movil .persona.elegida .cara::after { content: '✓'; position: absolute; right: -4px; bottom: -4px; width: 36px; height: 36px; border-radius: 50%; background: var(--azul-sel);
                                         color: #fff; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; font-family: 'Inter'; }
  .movil .enviar { height: 78px; border-radius: 20px; background: var(--azul-sel); color: #fff; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .movil .enviar.hecho { background: #2a2f3b; color: #cfd3dc; }
  .movil .previa { position: absolute; left: 40px; right: 40px; top: 60px; height: 230px; border-radius: 24px; background: linear-gradient(135deg, #1b2440, #10131c);
                   display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; color: #fff; text-align: center; padding: 0 30px; }
  .dedo { position: absolute; left: -60px; top: 0; font-size: 120px; filter: drop-shadow(0 10px 20px rgba(0,0,0,.6)); }
</style>
</head>
<body>
  <canvas id="webgl"></canvas>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="capa"></div>
  <div id="subs"></div>
  <script type="module" src="motor.js"></script>
</body>
</html>
